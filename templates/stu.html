
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registered Students</title>
</head>
<body>
    <h1>Registered Students</h1>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">No students registered yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p><a href="/">Back to Registration</a></p>
</body>
</html>
