
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration | MultiCloud Training</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb, #7c3aed);
        }

        .registration-card {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <main class="registration-card">
        <h2 class="text-center fw-bold">Student Registration</h2>
        <p class="text-center text-secondary">
            MultiCloud Training Program
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ 'alert-success' if category == 'success' else 'alert-danger' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form action="/" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Student Name</label>
                <input type="text"
                       class="form-control"
                       id="name"
                       name="name"
                       placeholder="Enter your full name"
                       maxlength="100"
                       required>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label">Email Address</label>
                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       maxlength="150"
                       required>
            </div>

            <button type="submit" class="register-btn">
                Register Student
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/students" class="text-decoration-none">
                View Registered Students
            </a>
        </div>
    </main>
</body>
</html>
